
name: SplitBro Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: splitbro-backend-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: splitbro-backend
  BACKEND_PATH: backend

jobs:
  build-and-deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Authenticate with AWS using GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 3. Verify AWS identity
      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # 4. Create ECR repository if it doesn't exist
      - name: Create ECR repository
        run: |
          if aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION" >/dev/null 2>&1; then

            echo "ECR repository already exists"

          else

            echo "Creating ECR repository"

            aws ecr create-repository \
              --repository-name "$ECR_REPOSITORY" \
              --region "$AWS_REGION" \
              --image-tag-mutability IMMUTABLE \
              --image-scanning-configuration scanOnPush=true \
              --encryption-configuration encryptionType=AES256

          fi

      # 5. Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 6. Generate image tag
      - name: Generate image tag
        id: image
        run: |
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      # 7. Build Docker image
      - name: Build Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          IMAGE_URI="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker build \
            -f backend/Dockerfile \
            -t "$IMAGE_URI" \
            backend/

          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      # 8. Push image to ECR
      - name: Push image to ECR
        run: |
          docker push "$IMAGE_URI"

      # 9. Deploy to EC2 through SSM
      - name: Deploy to EC2
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          PARAMETERS=$(jq -n \
            --arg command "sudo /usr/local/bin/deploy-splitbro '$IMAGE_URI'" \
            '{commands: [$command]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "SplitBro deployment $GITHUB_SHA" \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in $(seq 1 60); do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                echo "Deployment successful"
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --output json || true
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Deployment timed out"
          exit 1

      # 10. Deployment summary
      - name: Deployment summary
        if: success()
        run: |
          echo "## SplitBro Backend Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- ECR Repository: $ECR_REPOSITORY" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: $IMAGE_URI" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: SUCCESS" >> "$GITHUB_STEP_SUMMARY"
