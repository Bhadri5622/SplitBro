name: Show Repository Details

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  details:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Show repository information
        env:
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          OWNER_ID: ${{ github.repository_owner_id }}
          BRANCH_REF: ${{ github.ref }}
        run: |
          echo "Repository: $REPOSITORY"
          echo "Repository ID: $REPOSITORY_ID"
          echo "Owner ID: $OWNER_ID"
          echo "Branch ref: $BRANCH_REF"

      - name: Authenticate to AWS using OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::597302606393:role/oidc
          aws-region: us-east-1
          role-session-name: GitHubOIDCTest
          audience: sts.amazonaws.com

      - name: Verify AWS identity
        run: aws sts get-caller-identity
